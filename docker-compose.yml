# HLS WebVTT normalizer stack.
#
#   APP_PORT (host env, default 8080) selects the host port published
#   for the application.
#
# Normal usage:
#   docker compose up app            # serve the API
#
# Verification (one-shot; exits non-zero on any failure):
#   docker compose run --build verify
# or:
#   APP_PORT=9090 docker compose up \
#     --abort-on-container-exit --exit-code-from verify
services:
  app:
    build:
      context: .
    image: hls-webvtt-normalizer:latest
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # Host-side port is configurable via the APP_PORT env variable.
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  # One-shot verification: waits until app is healthy, then runs the
  # code tests, a build check and an API smoke test (wrap-around sample
  # included). The container's exit code reports the overall result.
  verify:
    image: hls-webvtt-normalizer:latest
    build:
      context: .
    environment:
      APP_URL: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    command: ["node", "scripts/verify.mjs"]
